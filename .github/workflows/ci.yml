# NonGravForces CI - modelled on referenceSystem's ci.yml (same owner, same
# runner, same MATLAB release). Two gates, cheapest first:
#   setupNonGravForces fetches the NRLMSISE-00 C source at a pinned commit the
#   first time it runs: that source is not in this repository (O-34) and the
#   density backend cannot build without it. ciGate calls setup before buildMex,
#   so CI needs no step of its own.
#
#   audit    auditPackage.py, stdlib only, seconds: catalogue <-> files, help
#            template, fail taxonomy, banned constructs (HANDOVER E.2/E.3, R1),
#            then the C-side checks that need no MATLAB: the MEX gateway is
#            compiled against a mex.h shim, and mex/ngfKernel.c is run against
#            the frozen Python mirror fixtures with the bounds tNgfMirror uses
#            on the MATLAB (LP-6b). ubuntu-latest has cc; the owner's host is
#            the only machine here with a MEX compiler, so a C typo would
#            otherwise wait for the matlab job.
#   matlab   Code Analyzer, then ciGate: dependency setups, the test suite,
#            the category audit, and the verdict. Only reached when audit is
#            green.
#
# NonGravForces has TWO inviolable dependencies that live in sibling
# repositories of the same organisation (HANDOVER A.2), and since LP-C a third
# one, odeSuite, that the GATE requires although the toolbox does not. CI checks
# all three out next to this repository so that ciGate's default DependencyRoot
# (the parent folder) is the same layout the owner uses locally.
#
# ALL FOUR REPOSITORIES ARE PRIVATE since the move to astrobayer. That has
# two consequences this file has to carry: matlab-actions no longer licenses
# MATLAB by itself, which is why the job runs on the self-hosted runner, and
# GITHUB_TOKEN no longer reaches the siblings, which is why the two sibling
# checkouts carry an organisation secret.
name: NonGravForces CI

on:
  push:
    branches: [main]
  pull_request:          # one run per dev push on the merge-preview commit
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # PINS MOVED 2026-09-20, because the runner asked. Run 35393563948
      # ended green while naming four of this file's actions across its
      # three jobs:
      #   ##[warning]Node.js 20 is deprecated. The following actions target
      #   Node.js 20 but are being forced to run on Node.js 24:
      #   actions/checkout@11d5960a..., actions/setup-python@a26af69b...,
      #   actions/upload-artifact@ea165f8d..., matlab-actions/run-command@37b454c3...
      # checkout moved to the v6 SHA astrobayer/ci-actions carries;
      # run-command to the v3 SHA the probe and gracefoReading already run,
      # which the runner did not flag.
      #
      # THE LAST TWO MOVED 2026-09-20, once their SHAs could be verified
      # against the upstream repositories rather than guessed:
      #   setup-python   v5 -> v6. node20 -> node24 is its ONLY breaking
      #                  change, and it runs here on ubuntu-latest.
      #   upload-artifact v4 -> v6. v5 is STILL node20 - measured, not
      #                  assumed - so v6 is the first major that fixes
      #                  anything. Its README warns that self-hosted runners
      #                  may need additional firewall rules, and the run-log
      #                  upload in the matlab job runs on the self-hosted
      #                  machine, so the pull request that moved it was the
      #                  experiment.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: '3.12' }
      - run: python3 auditPackage.py
      - name: C kernel checks (shim compile + parity against the frozen mirror)
        run: bash mex/test/runCChecks.sh

  # The theory document is BUILT, never committed (O-38). A PDF committed beside its own source
  # has no instrument keeping the two in step: the one in this repository was generated on
  # 2026-08-27, said "version 0.1.0" for three weeks and nine minor versions, and named three
  # options the toolbox refuses. So doc/src is the deliverable, this job is what proves it still
  # compiles, and the PDF is a run artefact anyone can download. A .tex that does not build is a
  # red gate, which is the whole point: it is the check that never existed.
  theory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: TeX Live (the packages the preamble names, not texlive-full)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-science texlive-fonts-recommended
      - name: Build the theory document
        working-directory: doc/src
        run: |
          # Twice: the table of contents needs the first pass's .aux. -halt-on-error so a broken
          # macro fails here and not in a reader's hands.
          pdflatex -halt-on-error -interaction=nonstopmode NonGravForces_Theory_and_Implementation.tex
          pdflatex -halt-on-error -interaction=nonstopmode NonGravForces_Theory_and_Implementation.tex
      - name: Refuse an undefined reference or citation
        working-directory: doc/src
        run: |
          # LaTeX reports these as warnings and still writes a PDF, so the exit code is not enough.
          if grep -qE "undefined (references|citations)|Undefined control sequence" \
               NonGravForces_Theory_and_Implementation.log; then
            grep -nE "undefined (references|citations)|Undefined control sequence" \
              NonGravForces_Theory_and_Implementation.log
            echo "::error::the theory document has undefined references or control sequences"
            exit 1
          fi
      - name: Build the user guide
        working-directory: doc/src
        run: |
          # The guide inputs theory_body.tex, references.tex, generated.tex and the 4000-line
          # api_generated.tex, so this is also what proves those inputs typeset. Three passes: the
          # appendix of 56 units moves the page numbers on the second.
          pdflatex -halt-on-error -interaction=nonstopmode NonGravForces_UserGuide.tex
          pdflatex -halt-on-error -interaction=nonstopmode NonGravForces_UserGuide.tex
          pdflatex -halt-on-error -interaction=nonstopmode NonGravForces_UserGuide.tex
      - name: Refuse an undefined reference or citation in the guide
        working-directory: doc/src
        run: |
          if grep -qE "undefined (references|citations)|Undefined control sequence" \
               NonGravForces_UserGuide.log; then
            grep -nE "undefined (references|citations)|Undefined control sequence" \
              NonGravForces_UserGuide.log
            echo "::error::the user guide has undefined references or control sequences"
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: theoryDocument
          path: doc/src/NonGravForces_Theory_and_Implementation.pdf
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: userGuide
          path: doc/src/NonGravForces_UserGuide.pdf

  matlab:
    needs: [audit]
    runs-on: [self-hosted, Windows]
    timeout-minutes: 45
    env:
      NONGRAVFORCES_CI: 1
      # The DATAPOOL root on this runner (organisation variable, owner decision 2026-09-19 in
      # timeSeriesPreparation's GUIDE): the GRACE-FO Level-1B days live below it under
      # GRACEFO\L1B\RL04\<yyyy>\<yyyy-mm-dd>\. Read by the N-10 regression month; empty when the
      # organisation has not granted the variable to this repository -- the next step says which.
      READING_DATA_POOL: ${{ vars.READING_DATA_POOL }}
    steps:
      # Says whether the pool reached this job and what of 2020-01 it holds. Reporting only: a
      # missing variable and a pool without the month produce the same skipped data downstream,
      # and without this line the two could not be told apart (gracefoReading's CI does the same).
      - name: Report the DATAPOOL this job sees
        shell: powershell                # the runner carries Windows PowerShell 5.1 only (pwsh fails; sibling repos measured it)
        run: |
          if (-not $env:READING_DATA_POOL) { Write-Output "READING_DATA_POOL is not set for this repository"; exit 0 }
          $m = Join-Path $env:READING_DATA_POOL "GRACEFO\L1B\RL04\2020"
          Write-Output "READING_DATA_POOL = $($env:READING_DATA_POOL)"
          if (Test-Path $m) { Write-Output ("2020 days present: " + (@(Get-ChildItem $m -Directory -Filter "2020-01-*").Count)) } else { Write-Output "no $m" }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { path: NonGravForces }
      # ciGate checks for ALL FIVE siblings - referenceSystem/setupReferenceSystem.m,
      # gracefoReading/setupGraceFOReading.m, odeSuite/gjToolboxSetup.m,
      # timeSeriesPreparation/setupTimeSeriesPreparation.m and lsqvce/lsqvce_setup.m. The
      # gracefoReading checkout was lost when this file was patched for the
      # self-hosted runner: the removal block ended mid-step and took the
      # following one with it. It never showed up as a failure because the
      # job did not get that far.
      #
      # THREE THINGS CHANGED AT ONCE, and each alone would break the job:
      #   owner   astrobayer, not matweigelt. Transfers redirect for the API
      #           but not for actions/checkout, which 404s on the old owner.
      #   token   GITHUB_TOKEN is scoped to THIS repository only. Both
      #           siblings went private with the move, so a second credential
      #           is required. REFERENCE_READ_TOKEN is an organisation secret
      #           scoped to this repository alone.
      #   creds   persist-credentials: false. actions/checkout otherwise
      #           writes the token into the workspace .git/config, and this
      #           runner keeps _work between runs while git clean -ffdx does
      #           not touch .git/config - the token would sit on the disk of
      #           a shared machine indefinitely.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: astrobayer/referenceSystem
          path: referenceSystem
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: astrobayer/gracefoReading
          path: gracefoReading
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          persist-credentials: false
      # odeSuite (gjToolbox) joined the gate with LP-C WP-C9: app.DynamicsSource
      # SUBCLASSES gjToolbox.DynamicsSource, so without this checkout the class
      # cannot load, the buildMex target "rhs" has no csrc/gj_native.h to compile
      # against, and tests/tNgfIntegration.m would not run at all - a green that
      # means nothing. It is optional for the toolbox and required for the gate.
      #
      # ref IS GIVEN ON PURPOSE, and only here, and it was a MEASUREMENT before
      # it was a preference. Without it actions/checkout first asks the REST API
      # for the default branch (Metadata:read); with it the action goes straight
      # to git-over-HTTPS (Contents:read). On 2026-09-16 the two sibling
      # checkouts above succeeded with this same secret in the same job, seconds
      # earlier, while odeSuite answered "Not Found" at that API call -- and,
      # with the API call skipped, 403 on the fetch. Two mechanisms, two
      # refusals: REFERENCE_READ_TOKEN does not reach this repository at all.
      # The ref stays because pinning the dependency branch is right anyway.
      # THIS STEP FAILS UNTIL THE TOKEN'S REPOSITORY SCOPE INCLUDES odeSuite
      # (HANDOVER O-39). It is deliberately not made continue-on-error: the
      # matlab job would then run without gjToolbox and report green about a
      # gate that never loaded app.DynamicsSource.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: astrobayer/odeSuite
          ref: main
          path: odeSuite
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          persist-credentials: false
      # timeSeriesPreparation and lsqvce joined the gate with O-45 (2026-10-14).
      # timeSeriesPreparation owns the CRN kernel sensor.Electrostatic filters
      # with by default (N-04) and, after N-01, the qc stage; lsqvce is the
      # estimator app.calibrate declares against from N-02 on. Same token, same
      # persist-credentials and the same ref-on-purpose as odeSuite above: the
      # ref skips the default-branch API call, so only Contents:read is needed.
      # Neither is continue-on-error, for odeSuite's reason: a gate that runs
      # without the dependency would report green about code it never loaded.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: astrobayer/timeSeriesPreparation
          ref: main
          path: timeSeriesPreparation
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: astrobayer/lsqvce
          ref: main
          path: lsqvce
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          persist-credentials: false
      # The probe and the reasoning behind it live in
      # astrobayer/ci-actions. Six repositories carried this step
      # byte-for-byte identically, and a copied step is what let one
      # editing mistake cost three repositories a checkout each.
      #
      # PINNED TO AN IMMUTABLE TAG, not @v1 and not @main: a moving tag
      # would let a commit in ci-actions change this repository's CI with
      # nothing in its diff to explain it.
      #
      # timeout-minutes sits here and not in the action: GitHub's
      # composite-action schema rejects the key on a step.
      - uses: astrobayer/ci-actions/matlab-probe@v1.2.0
        timeout-minutes: 2
      # NRLMSISE-00 is not fetched here. It was, for one run, in a bash step --
      # and this runner has no bash ("bash: command not found", 2026-09-09).
      # The right answer was not a different shell: setupNonGravForces already
      # runs first from ciGate, it is the installer a human runs anyway, and it
      # owns the URL and the pinned commit as a single authority (R1). A YAML
      # step would have been a second place to change them.

      - uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: |
            cd NonGravForces
            issues = codeIssues(fullfile(pwd, "+NonGravForces"));
            if ~isempty(issues.Issues)
                disp(issues.Issues(:, ["Location" "Severity" "CheckID" "Description"]));
                error("codeAnalyzer:findings", "%d Code Analyzer finding(s).", height(issues.Issues));
            end
            disp("Code Analyzer: clean");

      - uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: cd NonGravForces; ciGate

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()               # wanted most when the run is red
        with:
          name: nonGravForcesRunLog
          path: NonGravForces/tests/last_run.txt
