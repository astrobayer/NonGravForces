# NonGravForces CI - modelled on referenceSystem's ci.yml (same owner, same
# runner, same MATLAB release). Two gates, cheapest first:
#   audit    auditPackage.py, stdlib only, seconds: catalogue <-> files, help
#            template, fail taxonomy, banned constructs (HANDOVER E.2/E.3, R1).
#   matlab   Code Analyzer, then ciGate: dependency setups, the test suite,
#            the category audit, and the verdict. Only reached when audit is
#            green.
#
# NonGravForces has TWO inviolable dependencies that live in sibling
# repositories of the same owner (HANDOVER A.2). CI checks them out next to
# this repository so that ciGate's default DependencyRoot (the parent folder)
# is the same layout the owner uses locally. Both are public; no token.
#
# The repository is PUBLIC, so matlab-actions licenses MATLAB for free.
name: NonGravForces CI

on:
  push:
    branches: [main]
  pull_request:          # one run per dev push on the merge-preview commit
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 auditPackage.py

  matlab:
    needs: [audit]
    runs-on: [self-hosted, Windows]
    timeout-minutes: 45
    env:
      NONGRAVFORCES_CI: 1
    steps:
      - uses: actions/checkout@v4
        with: { path: NonGravForces }
      - uses: actions/checkout@v4
        with: { repository: matweigelt/referenceSystem, path: referenceSystem }
      # Set up MATLAB is GONE, not disabled. This repository went
      # private with the move to the organisation, and setup-matlab
      # licenses base MATLAB by itself only on a PUBLIC repository -
      # so the step could not have worked again, with or without a
      # self-hosted runner. The batch-licensing token that covers
      # private repositories comes from a MathWorks pilot closed to
      # new requests.
      #
      # The probe replaces it: seconds, and a missing or
      # misconfigured MATLAB fails by name here instead of as a
      # confusing error inside the suite.
      - name: Verify MATLAB on PATH (self-hosted)
        timeout-minutes: 2
        uses: matlab-actions/run-command@v3
        with:
          command: >
            fprintf('MATLAB on self-hosted runner: %s\n', version);
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            cd NonGravForces
            issues = codeIssues(fullfile(pwd, "+NonGravForces"));
            if ~isempty(issues.Issues)
                disp(issues.Issues(:, ["Location" "Severity" "CheckID" "Description"]));
                error("codeAnalyzer:findings", "%d Code Analyzer finding(s).", height(issues.Issues));
            end
            disp("Code Analyzer: clean");

      - uses: matlab-actions/run-command@v2
        with:
          command: cd NonGravForces; ciGate

      - uses: actions/upload-artifact@v4
        if: always()               # wanted most when the run is red
        with:
          name: nonGravForcesRunLog
          path: NonGravForces/tests/last_run.txt
