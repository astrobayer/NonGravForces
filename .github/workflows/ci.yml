# NonGravForces CI - modelled on referenceSystem's ci.yml (same owner, same
# runner, same MATLAB release). Two gates, cheapest first:
#   audit    auditPackage.py, stdlib only, seconds: catalogue <-> files, help
#            template, fail taxonomy, banned constructs (HANDOVER E.2/E.3, R1).
#   matlab   Code Analyzer, then ciGate: dependency setups, the test suite,
#            the category audit, and the verdict. Only reached when audit is
#            green.
#
# NonGravForces has TWO inviolable dependencies that live in sibling
# repositories of the same organisation (HANDOVER A.2). CI checks them out
# next to this repository so that ciGate's default DependencyRoot (the parent
# folder) is the same layout the owner uses locally.
#
# ALL THREE REPOSITORIES ARE PRIVATE since the move to astrobayer. That has
# two consequences this file has to carry: matlab-actions no longer licenses
# MATLAB by itself, which is why the job runs on the self-hosted runner, and
# GITHUB_TOKEN no longer reaches the siblings, which is why the two sibling
# checkouts carry an organisation secret.
name: NonGravForces CI

on:
  push:
    branches: [main]
  pull_request:          # one run per dev push on the merge-preview commit
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 auditPackage.py

  matlab:
    needs: [audit]
    runs-on: [self-hosted, Windows]
    timeout-minutes: 45
    env:
      NONGRAVFORCES_CI: 1
    steps:
      - uses: actions/checkout@v4
        with: { path: NonGravForces }
      # ciGate checks for BOTH siblings - referenceSystem/setupReferenceSystem.m
      # and gracefoReading/setupGraceFOReading.m - so both must be here. The
      # gracefoReading checkout was lost when this file was patched for the
      # self-hosted runner: the removal block ended mid-step and took the
      # following one with it. It never showed up as a failure because the
      # job did not get that far.
      #
      # THREE THINGS CHANGED AT ONCE, and each alone would break the job:
      #   owner   astrobayer, not matweigelt. Transfers redirect for the API
      #           but not for actions/checkout, which 404s on the old owner.
      #   token   GITHUB_TOKEN is scoped to THIS repository only. Both
      #           siblings went private with the move, so a second credential
      #           is required. REFERENCE_READ_TOKEN is an organisation secret
      #           scoped to this repository alone.
      #   creds   persist-credentials: false. actions/checkout otherwise
      #           writes the token into the workspace .git/config, and this
      #           runner keeps _work between runs while git clean -ffdx does
      #           not touch .git/config - the token would sit on the disk of
      #           a shared machine indefinitely.
      - uses: actions/checkout@v4
        with:
          repository: astrobayer/referenceSystem
          path: referenceSystem
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: astrobayer/gracefoReading
          path: gracefoReading
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          persist-credentials: false
      # The probe and the reasoning behind it live in
      # astrobayer/ci-actions. Six repositories carried this step
      # byte-for-byte identically, and a copied step is what let one
      # editing mistake cost three repositories a checkout each.
      #
      # PINNED TO AN IMMUTABLE TAG, not @v1 and not @main: a moving tag
      # would let a commit in ci-actions change this repository's CI with
      # nothing in its diff to explain it.
      #
      # timeout-minutes sits here and not in the action: GitHub's
      # composite-action schema rejects the key on a step.
      - uses: astrobayer/ci-actions/matlab-probe@v1.0.0
        timeout-minutes: 2

      - uses: matlab-actions/run-command@v2
        with:
          command: |
            cd NonGravForces
            issues = codeIssues(fullfile(pwd, "+NonGravForces"));
            if ~isempty(issues.Issues)
                disp(issues.Issues(:, ["Location" "Severity" "CheckID" "Description"]));
                error("codeAnalyzer:findings", "%d Code Analyzer finding(s).", height(issues.Issues));
            end
            disp("Code Analyzer: clean");

      - uses: matlab-actions/run-command@v2
        with:
          command: cd NonGravForces; ciGate

      - uses: actions/upload-artifact@v4
        if: always()               # wanted most when the run is red
        with:
          name: nonGravForcesRunLog
          path: NonGravForces/tests/last_run.txt
