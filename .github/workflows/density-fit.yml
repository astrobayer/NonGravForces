# Step 1 of the extrapolable density correction (HANDOVER O-19): a driver regression of the
# observed density scale log(rho_Swarm / rho_model) over Swarm 2014-now, cross-validated by year
# and across the 2020 solar minimum, on the CI runner's DATAPOOL.
#
# tools/densityDriverFit.m does the work and prints the tables into this log; nothing is committed.
# On demand and when the tool changes in a pull request; the Swarm months must be in the pool first
# (fetch-data.yml, input 'swarm').
name: Density driver fit

on:
  # On the pull request too: a workflow_dispatch workflow can be dispatched only once it is on the
  # default branch, and this one is new. The Swarm months are in the pool (fetch-data input 'swarm').
  pull_request:
    paths:
      - tools/densityDriverFit.m
      - .github/workflows/density-fit.yml
  workflow_dispatch:
    inputs:
      runner:
        description: "auto | a8 | hosted - narrows the routing, never widens it"
        required: false
        default: auto
      first:
        description: "first month, yyyy-mm"
        default: "2014-01"
      last:
        description: "last month, yyyy-mm"
        default: "2026-08"
      missions:
        description: "space-separated: swarm champ grace gracefo (TOLEOS months via fetch-data input 'densities')"
        default: "swarm"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Where may MATLAB run for this event: A8, a GitHub-hosted runner, or
  # nowhere? One decision for the whole organisation, in
  # astrobayer/ci-actions (ci-route; docs/CI_GUIDE.md section 2): members
  # only, no forks, A8 from a public repository only for the allow-listed
  # user. This job never fails - a refusal arrives in the MATLAB job as
  # runner=none and matlab-setup turns that required context red.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      runs-on: ${{ steps.route.outputs.runs-on }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - id: route
        uses: astrobayer/ci-actions/ci-route@v1.4.0
        with:
          policy: ${{ vars.CI_MATLAB_RUNNER }}
          request: ${{ github.event.inputs.runner }}

  fit:
    needs: [route]
    # A fork's pull request must not reach the self-hosted runner.
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && needs.route.outputs.runner == 'a8'
    runs-on: ${{ fromJSON(needs.route.outputs.runs-on) }}
    timeout-minutes: 240
    env:
      READING_DATA_POOL: ${{ vars.READING_DATA_POOL }}
      FIT_FIRST: ${{ github.event.inputs.first || '2014-01' }}
      FIT_LAST: ${{ github.event.inputs.last || '2026-08' }}
      FIT_MISSIONS: ${{ github.event.inputs.missions || 'swarm' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { path: NonGravForces, persist-credentials: false }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: astrobayer/referenceSystem
          path: referenceSystem
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: astrobayer/gracefoReading
          path: gracefoReading
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: astrobayer/timeSeriesPreparation
          ref: main
          path: timeSeriesPreparation
          token: ${{ secrets.REFERENCE_READ_TOKEN }}
          persist-credentials: false
      # MATLAB on the routed runner: probed on A8, installed by setup-matlab on a
      # GitHub-hosted runner (public repositories only), or a red step quoting
      # the routing refusal. Replaces matlab-probe; same immutable-tag rule.
      - uses: astrobayer/ci-actions/matlab-setup@v1.4.0
        timeout-minutes: 15
        with:
          runner: ${{ needs.route.outputs.runner }}
          reason: ${{ needs.route.outputs.reason }}
          products: ${{ vars.CI_MATLAB_PRODUCTS }}
      - uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: |
            ws = pwd;
            % The dependency setups call savepath; the machine keeps the path it had (O-43, as ciGate does).
            pd = which("pathdef"); before = ""; if ~isempty(pd), before = fileread(pd); end
            run(fullfile(ws, "referenceSystem", "setupReferenceSystem.m"));
            run(fullfile(ws, "gracefoReading", "setupGraceFOReading.m"));
            run(fullfile(ws, "timeSeriesPreparation", "setupTimeSeriesPreparation.m"));
            if strlength(before) > 0 && ~isequal(fileread(pd), char(before))
                fid = fopen(pd, "w"); fwrite(fid, before, "char"); fclose(fid);
            end
            cd(fullfile(ws, "NonGravForces"));
            setupNonGravForces('Verbose', false, 'FetchData', "never", 'FetchKernels', "never", 'FetchGroops', "never", 'FetchPool', "never");
            rep = NonGravForces.buildMex('Target', "msis");
            assert(rep.upToDate, "densityFit:mex", "MEX target msis did not build");
            R = densityDriverFit('First', string(getenv("FIT_FIRST")), 'Last', string(getenv("FIT_LAST")), 'Missions', split(strtrim(string(getenv("FIT_MISSIONS"))))');
            disp(R.sets.dayTrimmed.cv);
      - name: Remove the working copies from this machine
        if: always()
        shell: powershell
        run: Remove-Item -Recurse -Force NonGravForces, referenceSystem, gracefoReading, timeSeriesPreparation -ErrorAction SilentlyContinue
